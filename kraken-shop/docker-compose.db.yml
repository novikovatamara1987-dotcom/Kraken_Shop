
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s


  db-init:
    build: .
    image: kraken-shop:local
    command: ["node", "scripts/db-init.js"]
    environment:
      DB_SERVER: db
      DB_PORT: 1433
      DB_INSTANCE: ""
      DB_USER: sa
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    environment:
      DB_SERVER: db
      DB_PORT: 1433
      DB_INSTANCE: ""
      DB_USER: sa
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db-init:
        condition: service_completed_successfully

volumes:
  mssql-data:
